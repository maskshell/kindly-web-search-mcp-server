# import-linter configuration (Python Architecture-Contract Gate).
# Enforces the dependency direction of kindly_web_search_mcp_server:
# higher layers may import lower layers; lower layers must not import higher.
# Run: uv run lint-imports --config .importlinter.ini
# Docs: https://import-linter.readthedocs.io/

[importlinter]
root_package = kindly_web_search_mcp_server

[importlinter:contract:layers]
name = Layered architecture
type = layers
layers =
    kindly_web_search_mcp_server.cli
    kindly_web_search_mcp_server.server
    kindly_web_search_mcp_server.content
    kindly_web_search_mcp_server.search
    kindly_web_search_mcp_server.scrape
    kindly_web_search_mcp_server.utils
    kindly_web_search_mcp_server.models
    kindly_web_search_mcp_server.settings
